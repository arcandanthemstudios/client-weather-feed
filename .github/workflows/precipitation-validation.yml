name: Validate precipitation correction
on:
  push:
    branches: [repair/precision-aware-precipitation-20261117]
    paths: [repair/precision-repair.ready]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify and apply the reviewed repair only on its isolated branch
        env:
          EXPECTED_BRANCH: repair/precision-aware-precipitation-20261117
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('repair')
          encoded = ''.join((root / ('precision-part-' + str(i) + '.b64')).read_text().strip() for i in range(6))
          assert len(encoded) == 36080
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 90325
          assert hashlib.sha256(patch).hexdigest() == 'da00b5c2fdf9466f1d55bc7e353f6fb44f5e6b52953a9d13628f1120a5710c07'
          pathlib.Path('/tmp/precision-repair.patch').write_bytes(patch)
          allowed = ['.github/workflows/weather.yml','README.md','WORKFLOW.yml','docs/numerical-quality.md','docs/precipitation-precision.md','ops/precipitation_quality.py','ops/test_ecmwf_precision.py','ops/test_precipitation_quality.py','ops/watchdog.py','src/collect.mjs','src/core.mjs','src/ecmwf-precision.mjs','src/ecmwf_precision.py','src/precipitation-quality.mjs','src/public-view.mjs','src/static-feed.mjs','src/supplement.mjs','test/numerical-retry.test.mjs','test/precipitation-quality.test.mjs','test/precision-fixture.mjs']
          paths = [line.split('\t', 2)[2] for line in subprocess.check_output(['git','apply','--numstat','/tmp/precision-repair.patch'], text=True).splitlines()]
          assert sorted(paths) == sorted(allowed), paths
          subprocess.run(['git','apply','--check','/tmp/precision-repair.patch'], check=True)
          subprocess.run(['git','apply','/tmp/precision-repair.patch'], check=True)
          subprocess.run(['git','add','--',*allowed], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          assert pathlib.Path('.github/workflows/weather.yml').read_bytes() == pathlib.Path('WORKFLOW.yml').read_bytes()
          old = subprocess.check_output(['git','show','HEAD:.github/workflows/weather.yml'], text=True)
          new = pathlib.Path('.github/workflows/weather.yml').read_text()
          assert old.split('jobs:')[0] == new.split('jobs:')[0], 'Schedule or trigger changed'
          PY
      - name: Install and verify the actual ECMWF decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-eccodes
          /usr/bin/python3 -c 'import eccodes; print("ecCodes version:", eccodes.codes_get_api_version())'
      - name: Run both validators and all regression tests
        run: |
          set -o pipefail
          mkdir -p _validation
          npm test 2>&1 | tee _validation/node-tests.log
          /usr/bin/python3 -m unittest discover -s ops -p 'test_*.py' -v 2>&1 | tee _validation/python-tests.log
          if grep -q 'skipped=' _validation/python-tests.log; then echo 'A required integration test was skipped'; exit 1; fi
      - name: Acquire a live validation snapshot without publishing it
        run: |
          npm run build
          node src/collection-receipt.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c = JSON.parse(fs.readFileSync('_evidence/capture.json'));
          const v = JSON.parse(fs.readFileSync('_evidence/validated.json'));
          const m = v.summary.models.find(x=>x.model==='ecmwf_ifs025_ensemble');
          const r = c.records.find(x=>x.requested_model==='ecmwf_ifs025_ensemble');
          const audit = {scope:'live validation only, not deployed',generated_at_utc:v.generated_at_utc,ready_at_generation:v.ready_at_generation,precision:m?.variables?.precipitation?.precision_adjustment,proof_status:r?.precipitation_quality?.proofs?.status,retry:r?.numerical_retry?.performed};
          fs.writeFileSync('_validation/live-check.json',JSON.stringify(audit,null,2));
          console.log(JSON.stringify(audit));
          JS
      - name: Commit validated source to the repair branch only and remove staging helpers
        env:
          EXPECTED_BRANCH: repair/precision-aware-precipitation-20261117
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git rm -- .github/workflows/precipitation-validation.yml repair/precision-part-0.b64 repair/precision-part-1.b64 repair/precision-part-2.b64 repair/precision-part-3.b64 repair/precision-part-4.b64 repair/precision-part-5.b64 repair/precision-repair.ready
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply precision-bounded ECMWF correction with independent validation and audit trail'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          git rev-parse HEAD > _validation/validated-source-commit.txt
      - name: Retain validation evidence separately from Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precipitation-repair-validation
          path: |
            _validation/
            _evidence/
            src/
            test/
            ops/
            docs/
            package.json
            README.md
            WORKFLOW.yml
            .github/workflows/weather.yml
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
