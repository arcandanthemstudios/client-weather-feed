name: Refresh client weather feed
run-name: ${{ inputs.collection_slot && format('Refresh client weather feed [{0}]', inputs.collection_slot) || 'Refresh client weather feed' }}

on:
  workflow_dispatch:
    inputs:
      collection_slot:
        description: 'Intended report slot in UTC; provenance only, never a command'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '35 5,11,17 * * *'
      timezone: 'America/New_York'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'ops/**'
      - 'package.json'
      - '.github/workflows/weather.yml'

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.collect.outputs.ready }}
      generated_at_utc: ${{ steps.collect.outputs.generated_at_utc }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run offline validation tests
        run: |
          npm test
          python3 -m unittest discover -s ops -p 'test_*.py' -v
      - name: Fetch both ensembles and build the static feed
        id: collect
        run: npm run build
      - name: Record collection provenance without claiming report consumption
        env:
          COLLECTOR_SLOT_UTC: ${{ inputs.collection_slot }}
        run: node src/collection-receipt.mjs
      - name: Retain full evidence separately from the public site
        uses: actions/upload-artifact@v4
        with:
          name: collector-evidence
          path: _evidence/
          retention-days: 1
          if-no-files-found: error
      - name: Upload only the generated public weather site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy the weather feed
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Set up Node.js for public-feed verification
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify the deployed snapshot can be retrieved
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ needs.collect.outputs.generated_at_utc }}
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.SITE_URL);
          if (base.protocol !== 'https:') throw new Error('Expected an HTTPS Pages address');
          if (!base.pathname.endsWith('/')) base.pathname += '/';
          const url = new URL('status.json', base);
          url.searchParams.set('build', process.env.EXPECTED_BUILD);
          let last = 'No matching published status';
          for (let attempt = 0; attempt < 5; attempt++) {
            try {
              const res = await fetch(url, { signal: AbortSignal.timeout(15000), cache: 'no-store' });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const status = await res.json();
              if (status.schema !== 'client-ensemble-pages-v1' || status.test_only !== false)
                throw new Error('Unexpected or test-only published data');
              if (status.generated_at_utc !== process.env.EXPECTED_BUILD)
                throw new Error('Pages has not served this build yet');
              console.log(`Verified published snapshot: ${status.generated_at_utc}`);
              process.exit(0);
            } catch (error) { last = error.message; }
            if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error(last);
          NODE
      - name: Report incomplete upstream data after publishing the status
        if: needs.collect.outputs.ready != 'true'
        run: |
          echo 'The status page was published, but one or both ensembles failed validation or retrieval. See the collection log.'
          exit 1
